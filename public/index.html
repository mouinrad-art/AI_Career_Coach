<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Career Coach</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>
:root{font-family:Inter,system-ui,Arial;color:#e8eef9;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{background:#111e32;padding:24px max(20px,calc((100vw - 1000px)/2));border-bottom:1px solid #27354c}h1{margin:0;font-size:30px}header p{color:#9fb2cd;margin-bottom:0}main{max-width:1000px;margin:24px auto;padding:0 18px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}button{background:#3176ee;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer;font-weight:650}button:hover{background:#4b8bff}button.secondary{background:#253852}.tabs button.active{background:#1554bf}.panel{background:#152239;border:1px solid #2b405d;border-radius:16px;padding:24px;margin-bottom:22px}h2{margin-top:0}label{display:block;margin:16px 0 6px;color:#c8d6e9;font-weight:600}input,textarea,select{width:100%;padding:12px;background:#0c1729;color:#f1f6ff;border:1px solid #41536d;border-radius:9px;font:inherit}textarea{min-height:110px;resize:vertical}.wide{min-height:190px}.result{margin-top:20px;white-space:normal;line-height:1.65;overflow-wrap:anywhere}.result h2,.result h3{color:#9ec4ff}.msg{padding:13px 16px;margin:12px 0;border-radius:10px;white-space:pre-wrap}.assistant{background:#203d60}.user{background:#243a32}.muted{color:#a4b5cf;font-size:14px}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.error{color:#ffb2b2}a{color:#9bc5ff}
</style></head><body><header><h1>✦ AI Career Coach</h1><p>Prepare for interviews · Improve your CV · Plan your next career move</p></header><main><div class="tabs"><button id="tab-interview" onclick="tab('interview')">Mock Interview</button><button id="tab-cv" onclick="tab('cv')">CV Reviewer</button><button id="tab-fit" onclick="tab('fit')">Job Fit</button><button id="tab-roadmap" onclick="tab('roadmap')">Learning Roadmap</button></div>
<section class="panel" id="interview"><h2>Mock Interview</h2><label>Target role</label><input id="i-role" placeholder="e.g. QA Automation Engineer"><label>Job description (optional)</label><textarea id="i-jd" placeholder="Paste the job offer here"></textarea><label>Number of questions</label><select id="i-count"><option>3</option><option selected>5</option><option>8</option><option>10</option></select><div class="actions"><button onclick="startInterview()">Start Interview</button><button class="secondary" onclick="resetInterview()">Reset</button></div><div id="conversation"></div><div id="answer-box" class="hidden"><label>Your answer</label><textarea id="answer" placeholder="Type your answer..."></textarea><div class="actions"><button onclick="sendAnswer()">Submit Answer</button><button class="secondary" onclick="endInterview()">Finish & Get Feedback</button></div></div><div class="result" id="feedback"></div></section>
<section class="panel hidden" id="analysis"><h2 id="analysis-title">CV Reviewer</h2><label>Target role</label><input id="a-role" placeholder="e.g. Software Test Engineer"><label>Job description (optional, recommended for job fit)</label><textarea id="a-jd" placeholder="Paste the job description"></textarea><label>Upload CV (PDF, DOCX, TXT; up to 5 MB)</label><input id="cv-file" type="file" accept=".pdf,.docx,.txt" onchange="uploadCV()"><label>CV text (editable)</label><textarea class="wide" id="cv-text" placeholder="Or paste your CV here..."></textarea><div class="actions"><button id="analyze-button" onclick="runAnalysis()">Analyze CV</button><button class="secondary" onclick="downloadReport()">Download Report</button></div><div class="result" id="analysis-result"></div></section><p class="muted">Your CV is sent to the AI provider for analysis. Avoid uploading unnecessary sensitive personal information. Results are advisory, not hiring decisions.</p></main>
<script>
let mode='cv',history=[],questionCount=5,report='';const $=id=>document.getElementById(id);
function tab(t){['interview','cv','fit','roadmap'].forEach(x=>{$('tab-'+x).classList.toggle('active',x===t)});$('interview').classList.toggle('hidden',t!=='interview');$('analysis').classList.toggle('hidden',t==='interview');if(t!=='interview'){mode=t;let titles={cv:'CV Reviewer',fit:'Job-Fit & Skills Gap Analysis',roadmap:'Personalized Learning Roadmap'};$('analysis-title').textContent=titles[t];$('analyze-button').textContent=t==='cv'?'Analyze CV':t==='fit'?'Analyze Job Fit':'Create Roadmap';}}
async function api(path,payload){let res=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data=await res.json();if(!res.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed');return data}
function safeMarkdown(s){let html=marked.parse(s);let d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('script,iframe,object,embed,form,style,link').forEach(n=>n.remove());d.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{if(a.name.startsWith('on')||['href','src'].includes(a.name)&&!/^https?:\/\//i.test(a.value))n.removeAttribute(a.name)})});return d.innerHTML}
function message(role,text){let div=document.createElement('div');div.className='msg '+role;div.textContent=(role==='assistant'?'Interviewer: ':'You: ')+text;$('conversation').appendChild(div)}
function error(id,e){$(id).textContent='Error: '+e.message;$(id).classList.add('error')}
async function startInterview(){let role=$('i-role').value.trim();if(!role)return alert('Enter a target role');history=[];questionCount=Number($('i-count').value);$('conversation').innerHTML='';$('feedback').innerHTML='';$('answer-box').classList.remove('hidden');await nextQuestion()}
async function nextQuestion(){try{let d=await api('interview',{role:$('i-role').value,job_description:$('i-jd').value,history,question_count:questionCount});if(d.finished){await endInterview();return}history.push({role:'assistant',content:d.question});message('assistant',d.question)}catch(e){error('feedback',e)}}
async function sendAnswer(){let text=$('answer').value.trim();if(!text)return;history.push({role:'user',content:text});message('user',text);$('answer').value='';if(history.filter(x=>x.role==='assistant').length>=questionCount){await endInterview()}else await nextQuestion()}
async function endInterview(){if(!history.some(x=>x.role==='user'))return alert('Answer at least one question');$('answer-box').classList.add('hidden');$('feedback').textContent='Evaluating interview...';try{let d=await api('feedback',{role:$('i-role').value,job_description:$('i-jd').value,history,question_count:questionCount});$('feedback').innerHTML=safeMarkdown(d.report);let previous=JSON.parse(localStorage.getItem('career_interviews')||'[]');previous.unshift({date:new Date().toISOString(),role:$('i-role').value,report:d.report});localStorage.setItem('career_interviews',JSON.stringify(previous.slice(0,10)))}catch(e){error('feedback',e)}}
function resetInterview(){history=[];$('conversation').innerHTML='';$('feedback').innerHTML='';$('answer-box').classList.add('hidden')}
async function uploadCV(){let f=$('cv-file').files[0];if(!f)return;let form=new FormData();form.append('file',f);$('analysis-result').textContent='Extracting CV...';try{let r=await fetch('/api/extract',{method:'POST',body:form});let d=await r.json();if(!r.ok)throw Error(d.detail||'Upload failed');$('cv-text').value=d.text;$('analysis-result').textContent='CV loaded successfully.'}catch(e){error('analysis-result',e)}}
async function runAnalysis(){let cv=$('cv-text').value.trim(),role=$('a-role').value.trim();if(cv.length<20||role.length<2)return alert('Enter a target role and CV text');$('analysis-result').textContent='Analyzing...';try{let d=await api('analyze',{cv,role,job_description:$('a-jd').value,kind:mode});report=d.report;$('analysis-result').innerHTML=safeMarkdown(report)}catch(e){error('analysis-result',e)}}
function downloadReport(){if(!report)return alert('Generate a report first');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([report],{type:'text/markdown'}));a.download='career-coach-report.md';a.click();URL.revokeObjectURL(a.href)}
tab('interview');
</script></body></html>
